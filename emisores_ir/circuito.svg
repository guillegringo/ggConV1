<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="960" height="470" fill="#ffffff"/>
  <defs>
    <g id="led">
      <polygon points="-10,-8 10,-8 0,8" fill="#7a3fb0" stroke="#222" stroke-width="1.5"/>
      <line x1="-10" y1="8" x2="10" y2="8" stroke="#222" stroke-width="2"/>
      <path d="M12,-6 l12,-8 M20,-15 l4,1 l-2,4" stroke="#b03030" stroke-width="1.5" fill="none"/>
      <path d="M12,2 l12,-8 M20,-7 l4,1 l-2,4" stroke="#b03030" stroke-width="1.5" fill="none"/>
    </g>
    <g id="emisor">
      <rect x="-70" y="0" width="140" height="270" rx="14" fill="#f4f5f7" stroke="#666" stroke-width="2"/>
      <line x1="-70" y1="40" x2="70" y2="40" stroke="#c0392b" stroke-width="3"/>
      <line x1="-70" y1="250" x2="70" y2="250" stroke="#222" stroke-width="3"/>
      <line x1="0" y1="40" x2="0" y2="64" stroke="#222" stroke-width="2"/>
      <rect x="-7" y="64" width="14" height="32" fill="#f3e2b3" stroke="#222" stroke-width="1.5"/>
      <text x="14" y="85" font-size="13">22 Ω</text>
      <line x1="0" y1="96" x2="0" y2="122" stroke="#222" stroke-width="2"/>
      <use href="#led" x="0" y="130"/>
      <line x1="0" y1="138" x2="0" y2="162" stroke="#222" stroke-width="2"/>
      <use href="#led" x="0" y="170"/>
      <line x1="0" y1="178" x2="0" y2="202" stroke="#222" stroke-width="2"/>
      <use href="#led" x="0" y="210"/>
      <line x1="0" y1="218" x2="0" y2="250" stroke="#222" stroke-width="2"/>
      <text x="-62" y="266" font-size="11" fill="#666">ánodo (pata larga) arriba</text>
    </g>
  </defs>

  <text x="20" y="32" font-size="19" font-weight="600">Emisores IR: 4 cajas en paralelo, cada una R 22 Ω + 3 LEDs IR en serie, USB 5 V</text>

  <rect x="20" y="110" width="96" height="60" rx="8" fill="#ddd" stroke="#555" stroke-width="2"/>
  <text x="40" y="136" font-weight="600">USB-A</text>
  <text x="28" y="156" font-size="12">cargador / PC</text>

  <!-- +5V -->
  <polyline points="116,125 140,125 140,100 170,100" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="120" y="92" font-size="12" fill="#c0392b">rojo +5V</text>
  <!-- GND -->
  <polyline points="116,155 140,155 140,310 170,310" fill="none" stroke="#222" stroke-width="3"/>
  <text x="146" y="330" font-size="12">negro GND</text>

  <g transform="translate(240,60)"><use href="#emisor"/></g>
  <g transform="translate(430,60)"><use href="#emisor"/></g>
  <g transform="translate(620,60)"><use href="#emisor"/></g>
  <g transform="translate(810,60)"><use href="#emisor"/></g>

  <!-- cable entre cajas -->
  <line x1="310" y1="100" x2="360" y2="100" stroke="#c0392b" stroke-width="3"/>
  <line x1="500" y1="100" x2="550" y2="100" stroke="#c0392b" stroke-width="3"/>
  <line x1="690" y1="100" x2="740" y2="100" stroke="#c0392b" stroke-width="3"/>
  <line x1="310" y1="310" x2="360" y2="310" stroke="#222" stroke-width="3"/>
  <line x1="500" y1="310" x2="550" y2="310" stroke="#222" stroke-width="3"/>
  <line x1="690" y1="310" x2="740" y2="310" stroke="#222" stroke-width="3"/>

  <text x="200" y="365" font-size="13" font-weight="600">Arriba izq.</text>
  <text x="390" y="365" font-size="13" font-weight="600">Arriba der.</text>
  <text x="583" y="365" font-size="13" font-weight="600">Abajo der.</text>
  <text x="773" y="365" font-size="13" font-weight="600">Abajo izq.</text>

  <text x="20" y="405" font-size="13">Por LED IR 5 mm típico (Vf ≈ 1,3 V): 5 V − 3 × 1,3 V = 1,1 V sobre 22 Ω → ~45-50 mA por caja · total ~200 mA (cualquier USB alcanza).</text>
  <text x="20" y="428" font-size="13">El cable USB entra a la primera caja; de cada caja sale otro tramo (rojo/negro) a la siguiente. Los LEDs de cada caja van en serie; las cajas, en paralelo.</text>
  <text x="20" y="451" font-size="13">Si los LEDs que consigas tienen otra Vf, recalculá R = (5 − 3·Vf) / I, con I entre 40 y 70 mA.</text>
</svg>
